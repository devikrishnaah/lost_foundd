<!DOCTYPE html>
<html>
<head>
<title>Lost & Found - Proof of Ownership</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #667eea, #764ba2);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2, h3 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 20px;
    border: none;
    background: #667eea;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #5a67d8;
}

.success {
    color: green;
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
}

.error {
    color: red;
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h2>🔐 Proof of Ownership System</h2>

<!-- Finder Section -->
<div id="finderSection">
<h3>Finder: Create Quiz</h3>

<label>Item Name:</label>
<input type="text" id="itemName" required>

<label>Finder Phone Number:</label>
<input type="text" id="finderPhone" placeholder="Enter your phone number">

<label>Question 1:</label>
<input type="text" id="q1">
<label>Answer 1:</label>
<input type="text" id="a1">

<label>Question 2:</label>
<input type="text" id="q2">
<label>Answer 2:</label>
<input type="text" id="a2">

<label>Question 3:</label>
<input type="text" id="q3">
<label>Answer 3:</label>
<input type="text" id="a3">

<button onclick="createQuiz()">Create Quiz</button>

<div id="message" class="success hidden"></div>
</div>

<script>
function createQuiz() {
    const itemName = document.getElementById('itemName').value.trim();
    const phone = document.getElementById('finderPhone').value.trim();
    const q1 = document.getElementById('q1').value.trim();
    const a1 = document.getElementById('a1').value.trim();
    const q2 = document.getElementById('q2').value.trim();
    const a2 = document.getElementById('a2').value.trim();
    const q3 = document.getElementById('q3').value.trim();
    const a3 = document.getElementById('a3').value.trim();

    if (!itemName || !phone) {
        alert("Please enter both item name and your phone number.");
        return;
    }

    // Store quiz in localStorage (or send to backend if implemented)
    const quiz = {
        itemName,
        phone,
        questions: [
            {q: q1, a: a1},
            {q: q2, a: a2},
            {q: q3, a: a3}
        ]
    };

    let allQuizzes = JSON.parse(localStorage.getItem('proofQuizzes') || '[]');
    allQuizzes.push(quiz);
    localStorage.setItem('proofQuizzes', JSON.stringify(allQuizzes));

    // Show thank you message and close window after 2 seconds
    const msgDiv = document.getElementById('message');
    msgDiv.textContent = "Thank you! Quiz created successfully. This window will close shortly.";
    msgDiv.classList.remove('hidden');

    setTimeout(() => {
        window.close();
    }, 2000);
}
</script>

</body>
</html>
